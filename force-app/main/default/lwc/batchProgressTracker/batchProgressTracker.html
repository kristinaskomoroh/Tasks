<template>
    <div class="slds-box slds-theme_default slds-text-align_center">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">{labels.GenerateXMLFileLabel}</h2>
            <p class="slds-m-top_large">
                {labels.PackagesProcessedLabel} <b>{processedItems}</b> from <b>{totalItems}</b>
            </p>
            <lightning-progress-bar value={progressPercentage} size="large" class="slds-m-top_medium"></lightning-progress-bar>
            <p class="slds-m-top_small slds-text-color_weak">{labels.StatusLabel} {status}</p>
        <template if:true={isError}>
            <p class="slds-text-color_error">{labels.GenerateFileErrorLabel} {errors}</p>
        </template>
    </div>
</template>

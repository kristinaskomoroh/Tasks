<template>
    <template lwc:if={showJoinModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{labels.NewUserLabel}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label={labels.FirstNameLabel} ></lightning-input>
                    <lightning-input label={labels.LastNameLabel}></lightning-input>
                    <lightning-input label={labels.MobilePhoneLabel} ></lightning-input>
                    <lightning-input label={labels.BirthdayDateLabel} type="date"></lightning-input>
                    <lightning-input label={labels.EmailLabel} type="email"></lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label={labels.CancelLabel} onclick={closeJoinModal}></lightning-button>
                    <lightning-button variant="brand" label={labels.SaveLabel} onclick={closeJoinModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>

<template>
    <lightning-quick-action-panel header={headerText}>
        <template if:true={isConfirmStep}>
            <div class="slds-text-align_center slds-p-around_medium slds-text-heading_small">
                {labels.FirstModalLabel}
            </div>
        </template>
        <template if:true={isEnterNumberStep}>
            <div class="slds-text-align_center slds-p-around_medium slds-text-heading_small">
                {labels.EnterNumberLabel}
            </div>
            <lightning-input
                type="text"
                placeholder="Enter the debitor number..."
                onchange={handleInputNumber}>
            </lightning-input>
        </template>
        <template if:true={isEditFormStep}>
            <div class="slds-is-relative"> <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>
            <lightning-record-view-form
                record-id={recordId}
                object-api-name="Order"
                onload={handleFormLoad}>
                <lightning-messages></lightning-messages>
                <div class="slds-form-element slds-form-element_stacked slds-m-vertical_x-small">
                    <span class="slds-form-element__label">{labels.OrderNameLabel}</span>
                    <div class="slds-form-element__control">
                        <lightning-formatted-url
                            value={orderUrl}
                            label={orderName}
                            target="_blank">
                        </lightning-formatted-url>
                    </div>
                </div>

                <div class="slds-m-vertical_medium slds-border_bottom"></div>

                <lightning-output-field field-name="Ticket_status__c"></lightning-output-field>
            </lightning-record-view-form>
            </div>

            <div class="slds-m-vertical_medium slds-border_bottom"></div>

            <template if:true={contactId}>
                <div class="slds-is-relative"> <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </template>
                <lightning-record-edit-form
                    record-id={contactId}
                    object-api-name="Contact"
                    class="my-form"
                    onsuccess={handleContactSuccess}
                    onload={handleFormLoad}>
                    <lightning-messages></lightning-messages>
                    <template if:false={isEditingMode}>
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <div class="slds-col">
                                <lightning-output-field field-name="Debitor_number__c"></lightning-output-field>
                            </div>
                            <div class="slds-m-left_small slds-m-bottom_small">
                                <lightning-button-icon
                                    icon-name="utility:edit"
                                    variant="bare"
                                    onclick={enableEditMode}
                                    data-id={debitorNum}
                                    alternative-text="Edit">
                                </lightning-button-icon>
                            </div>
                        </div>
                    </template>
                    <template if:true={isEditingMode}>
                        <div class="slds-grid slds-grid_vertical-align-end">
                            <div class="slds-col">
                                <lightning-input-field
                                    class="debitor-input"
                                    field-name="Debitor_number__c"
                                    onchange={handleInputNumber}>
                                </lightning-input-field>
                            </div>

                            <div class="slds-m-left_x-small slds-m-bottom_small">
                                <lightning-button-icon
                                    icon-name="utility:check"
                                    variant="brand"
                                    onclick={confirmEdit}
                                    class="slds-m-right_xx-small"
                                    alternative-text="Confirm">
                                </lightning-button-icon>

                                <lightning-button-icon
                                    icon-name="utility:close"
                                    variant="destructive"
                                    onclick={cancelEdit}
                                    alternative-text="Cancel">
                                </lightning-button-icon>
                            </div>
                        </div>
                    </template>
                </lightning-record-edit-form>
                </div>
            </template>
        </template>
        <div class="slds-modal_footer" slot="footer">
            <lightning-button label={labels.CancelLabel} onclick={closeModal}></lightning-button>
            <lightning-button label={labels.SaveLabel} variant="brand" class="slds-m-left_x-small" onclick={handleAction}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>

<template>

    <div class="slds-m-bottom_small">
        <lightning-input type="text" label="Search by Name" onchange={handleSearch}></lightning-input>
    </div>

    
    <lightning-button label="New" onclick={openModal} class="slds-m-bottom_small"></lightning-button>
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">New Product</h2>
                </header>
            <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Name" value={newProduct.Name} onchange={handleInputChange} data-field="Name" required></lightning-input>
                    <lightning-input label="Description" value={newProduct.Description__c} onchange={handleInputChange} data-field="Description__c"></lightning-input>
                    <lightning-input label="Image URL" value={newProduct.ImageURL__c} onchange={handleInputChange} data-field="ImageURL__c"></lightning-input>
                    <lightning-input label="Unit Price" type="number" min="0" value={newProduct.UnitPrice__c} onchange={handleInputChange} data-field="UnitPrice__c" required></lightning-input>
                    <lightning-input label="Units Available" type="number" min="0" value={newProduct.UnitsAvailable__c} onchange={handleInputChange} data-field="UnitsAvailable__c"></lightning-input>
                    <lightning-input label="Added Date" value={newProduct.AddedDate__c} type="date" onchange={handleInputChange} data-field="AddedDate__c"></lightning-input>
                </div>

               
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={saveProduct}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    
    
   
    <template if:true={isEditModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Edit Product</h2>
                </header>
            <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input label="Name" value={editProduct.Name} onchange={handleEditInputChange} data-field="Name" required></lightning-input>
                    <lightning-input label="Description" value={editProduct.Description__c} onchange={handleEditInputChange} data-field="Description__c"></lightning-input>
                    <lightning-input label="Image URL" value={editProduct.ImageURL__c} onchange={handleEditInputChange} data-field="ImageURL__c"></lightning-input>
                    <lightning-input label="Unit Price" type="number" min="0" value={editProduct.UnitPrice__c} onchange={handleEditInputChange} data-field="UnitPrice__c" required></lightning-input>
                    <lightning-input label="Units Available" type="number" min="0" value={editProduct.UnitsAvailable__c} onchange={handleEditInputChange} data-field="UnitsAvailable__c"></lightning-input>
                    <lightning-input label="Added Date" value={editProduct.AddedDate__c} type="date" onchange={handleEditInputChange} data-field="AddedDate__c"></lightning-input>
                </div>

               
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeEditModal}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={EditProduct}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>


   
    <template if:true={isDeleteModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Delete Product</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                <p>Are you sure you want to delete this product?</p>
            </div>
           
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="No" onclick={canselDelete}></lightning-button>
                    <lightning-button variant="brand" label="Yes" onclick={confirmDelete}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    
    
        <lightning-card  title="Product List" icon-name = "standard:product">
             <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
             </template>
             <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_fixed-layout">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">Name</th>
                        <th scope="col">Description</th>
                        <th scope="col">Image</th>
                        <th scope="col">Price</th>
                        <th scope="col">Available Units</th>
                        <th scope="col">Added Date</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>

                <tbody>
                <template if:true={pagedProducts}>
                    <template for:each={pagedProducts} for:item="product">
                        <tr key={product.Id}>
                            <td>{product.Name}</td>
                            <td style="max-width:200px; white-space: normal; word-wrap: break-word; vertical-align: bottom;">{product.Description__c}</td>
                            <td><img src={product.ImageURL__c} alt={product.NameURL__c} width="100" height="100"/></td>
                            <td>{product.UnitPrice__c}</td>
                            <td>{product.UnitsAvailable__c}</td>
                            <td>{product.AddedDate__c}</td>
                            <td>
                                 <lightning-button-icon icon-name="utility:edit" alternative-text="Edit" variant="brand" data-id={product.Id}  onclick={openEditModal}></lightning-button-icon>
                                 <span style="margin: 0 8px;">/</span>
                                <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" variant="destructive" data-id={product.Id}  onclick={openDeleteModal}></lightning-button-icon>
                            </td>
                        </tr>
                    </template>
                </template>
                </tbody>
            </table>
        </lightning-card>
    

        <div class="slds-m-top_medium slds-grid slds-grid_align-center">
            <lightning-button label="Prev" onclick={prevPage} disabled={isFirstPage}></lightning-button>
            <span class="slds-p-horizontal_small">
                 Page {currentPage} of {totalPages}
            </span>
            <lightning-button label="Next" onclick={nextPage} disabled={isLastPage}></lightning-button>
        </div>
</template>

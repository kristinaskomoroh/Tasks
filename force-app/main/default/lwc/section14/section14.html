<template>
    <div class="slds-grid slds-grid_align-center">
        <div class="slds-col">
            <h1 style="font-size:40px; font-family:Georgia; font-weight:bold;">SOQL Builder</h1>
        </div>
    </div>
    <p style="font-size:20px; font-family:Georgia; font-style:italic;">Choose the object, field and criteria to build a SOQL query below:</p>
    <div class="borders">
        <div class="form-style">
            <lightning-combobox name="objectSelector" label="Choose an object" value={selectedObject} placeholder="Enter the name..." options={objectOptions} onchange={handleChangeObject}> </lightning-combobox>
                <template if:true={fieldOptions.length}>
                    <div class="slds-m-top_medium">
                        <lightning-dual-listbox label="Select Fields" source-label="Available" selected-label="Selected" options={fieldOptions} value={selectedFields} onchange={handleFieldChange}></lightning-dual-listbox>
                    </div>
                </template>
            <template if:true={isFieldSelected}>
                <p class="slds-m-top_medium"><strong>Add Filter:</strong></p>
                    <div class="slds-grid slds-gutters slds-m-top_x-small">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox label="Field" options={fieldOptions} onchange={handleWhereFieldChange}></lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox label="Operator" options={operatorOptions} value={whereOperator} onchange={handleOperatorChange}></lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input label="Value" type="text" onchange={handleWhereValueChange}></lightning-input>
                        </div>
                    </div>
            </template>
        </div>
    </div>
    <template if:true={isWhereConditionSelected}>
        <div class="borders">
            <div class="form-style">
                <div class="slds-grid slds-gutters slds-m-top_medium">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input type="number" label="Enter limit" placeholder="..." onchange={handleLimitChange}></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input type="number" label="Enter offset" placeholder="..." onchange={handleOffsetChange}></lightning-input>
                    </div>
                </div>
                <template if:true={isLimitAndOffsetSelected}>
                    <div class="slds-grid slds-grid_align-center slds-m-top_large">
                        <div class="slds-col">
                            <lightning-button label="Generate Query" onclick={handleGenerate} class="slds-m-top_medium"></lightning-button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>
    <template if:true={finalQuery}>
        <div class="borders">
            <div class="form-style" style="width:auto">
                <div class="slds-grid slds-gutters slds-m-top_large">
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-textarea label="Edit Generated SOQL" value={finalQuery} onchange={handleQueryEdit} class="custom-textarea">
                            <div class="slds-grid slds-grid_align-center slds-m-top_large">
                                <div class="slds-col">
                                    <lightning-button label="Execute Query" onclick={handleExecute} class="slds-m-top_medium"></lightning-button>
                                </div>
                            </div>
                        </lightning-textarea>
                    </div>
                </div>
            </div>
        </div>
    <template if:true={isInvalidLimit}>
        <template if:true={hasExecuted}>
            <p class="slds-text-color_weak slds-m-top_medium">No records found (check your LIMIT or filters).</p>
        </template>
    </template>
    <c-soql-result query-result={finalQuery}></c-soql-result>
    <c-soql-result data={queryData}></c-soql-result>
    <c-soql-result has-executed={hasExecuted}></c-soql-result>
    <c-soql-result visible-data={visibleData}></c-soql-result>
</template>

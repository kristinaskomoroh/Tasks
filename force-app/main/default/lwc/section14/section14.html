<template>
    <div class="slds-grid slds-grid_align-center">
        <div class="slds-col nameBuilder">
            <h1>{labels.SoqlLabel}</h1>
        </div>
    </div>
    <p class="builder">{labels.SoqlBodyLabel}</p>
    <div class="borders">
        <div class="form-style">
            <lightning-combobox name="objectSelector" label={labels.ChooseAnObjectLabel} value={selectedObject} placeholder={labels.EnterTheNameLabel} options={objectOptions} onchange={handleChangeObject}> </lightning-combobox>
                <template if:true={fieldOptions.length}>
                    <div class="slds-m-top_medium">
                        <lightning-dual-listbox label={labels.SelectFieldsLabel} source-label={labels.AvailableLable} selected-label={labels.SelectedLable} options={fieldOptions} value={selectedFields} onchange={handleFieldChange}></lightning-dual-listbox>
                    </div>
                </template>
            <template if:true={isFieldSelected}>
                <p class="slds-m-top_medium"><strong>{labels.AddFilterLabel}</strong></p>
                    <div class="slds-grid slds-gutters slds-m-top_x-small">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox label={labels.FieldLabel} options={fieldOptions} onchange={handleWhereFieldChange}></lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox label={labels.OperatorLabel} options={operatorOptions} value={whereOperator} onchange={handleOperatorChange}></lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-input label={labels.ValueLabel} type="text" onchange={handleWhereValueChange}></lightning-input>
                        </div>
                    </div>
            </template>
        </div>
    </div>
    <template if:true={isWhereConditionSelected}>
        <div class="borders">
            <div class="form-style">
                <div class="slds-grid slds-gutters slds-m-top_medium">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input type="number" label={labels.EnterLimitLabel} placeholder="..." onchange={handleLimitChange}></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input type="number" label={labels.EnterOffsetLabel} placeholder="..." onchange={handleOffsetChange}></lightning-input>
                    </div>
                </div>
                <template if:true={isLimitAndOffsetSelected}>
                    <div class="slds-grid slds-grid_align-center slds-m-top_large">
                        <div class="slds-col">
                            <lightning-button label={labels.GenerateQueryLabel} onclick={handleGenerate} class="slds-m-top_medium"></lightning-button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </template>
    <template if:true={finalQuery}>
        <div class="borders">
            <div class="form-style" style="width:auto">
                <div class="slds-grid slds-gutters slds-m-top_large">
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-textarea label={labels.EditGeneratedSOQLLabel} value={finalQuery} onchange={handleQueryEdit} class="custom-textarea"></lightning-textarea>
                            <div class="slds-grid slds-grid_align-center slds-m-top_large">
                                <div class="slds-col">
                                    <lightning-button label={labels.ExecuteQueryLabel} onclick={handleExecute} class="slds-m-top_medium"></lightning-button>
                                </div>
                            </div>
                    </div>
                </div>
            </div>
        </div>
        <template if:true={emptyMessage}>
            <p class="slds-text-color_weak slds-m-top_medium">{labels.NoRecordsLabel}</p>
        </template>
    <c-soql-result query-result={finalQuery}></c-soql-result>
    <c-soql-result data={queryData}></c-soql-result>
    <c-soql-result has-executed={hasExecuted}></c-soql-result>
    <c-soql-result visible-data={visibleData}></c-soql-result>
</template>
